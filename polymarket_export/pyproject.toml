[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-export"
version = "0.1.0"
description = "Polymarket export and registry utilities."
requires-python = ">=3.11"

[tool.setuptools]
include-package-data = false
py-modules = ["config", "utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clients*", "collectors*", "configs*", "polymarket_registry*", "storage*"]

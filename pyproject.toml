[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-research"
version = "0.1.0"
description = "Reusable data abstractions for Polymarket research workflows."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
pmr-build-canonical = "polymarket_research.scripts.build_canonical:main"
pmr-build-benchmarks = "polymarket_research.scripts.build_benchmarks:main"
pmr-materialize-artifacts = "polymarket_research.scripts.materialize_artifacts:main"
pmr-build-paper-artifacts = "polymarket_research.scripts.build_paper_artifacts:main"
pmr-check-paper-artifacts = "polymarket_research.scripts.check_paper_artifacts:main"

[project.optional-dependencies]
hf = ["huggingface-hub>=0.20"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["polymarket_research*"]
